{{ $shader := .Page.Resources.GetMatch (.Get "src") }}

{{ if not $shader }}

<p>
    Shader not found: {{ .Get "src" }}
</p>

{{ else }}

<canvas
    id="glsl-{{ .Ordinal }}"
    style="
        width: {{ .Get "width" | default "400px" }};
        height: {{ .Get "height" | default "400px" }};
    ">
</canvas>

<script>
(() => {

    const canvas = document.getElementById("glsl-{{ .Ordinal }}");

    const gl = canvas.getContext("webgl");

    if (!gl)
    {
        console.error("WebGL unavailable");
        return;
    }


    const vertexSource = `
        attribute vec2 position;

        void main()
        {
            gl_Position = vec4(position, 0.0, 1.0);
        }
    `;


    fetch("{{ $shader.RelPermalink }}")
        .then(r => r.text())
        .then(fragmentSource =>
        {

            function compileShader(type, source)
            {
                const shader = gl.createShader(type);

                gl.shaderSource(shader, source);
                gl.compileShader(shader);

                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
                {
                    console.error(
                        gl.getShaderInfoLog(shader)
                    );

                    return null;
                }

                return shader;
            }


            const vertexShader =
                compileShader(
                    gl.VERTEX_SHADER,
                    vertexSource
                );


            const fragmentShader =
                compileShader(
                    gl.FRAGMENT_SHADER,
                    fragmentSource
                );


            if (!vertexShader || !fragmentShader)
                return;


            const program = gl.createProgram();


            gl.attachShader(
                program,
                vertexShader
            );

            gl.attachShader(
                program,
                fragmentShader
            );


            gl.linkProgram(program);


            if (!gl.getProgramParameter(
                program,
                gl.LINK_STATUS))
            {
                console.error(
                    gl.getProgramInfoLog(program)
                );

                return;
            }


            gl.useProgram(program);



            // fullscreen triangle

            const buffer = gl.createBuffer();

            gl.bindBuffer(
                gl.ARRAY_BUFFER,
                buffer
            );


            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array([
                    -1.0, -1.0,
                     3.0, -1.0,
                    -1.0,  3.0
                ]),
                gl.STATIC_DRAW
            );


            const position =
                gl.getAttribLocation(
                    program,
                    "position"
                );


            gl.enableVertexAttribArray(position);


            gl.vertexAttribPointer(
                position,
                2,
                gl.FLOAT,
                false,
                0,
                0
            );



            // uniforms

            const uResolution =
                gl.getUniformLocation(
                    program,
                    "u_resolution"
                );


            const uTime =
                gl.getUniformLocation(
                    program,
                    "u_time"
                );


            const uMouse =
                gl.getUniformLocation(
                    program,
                    "u_mouse"
                );



            let mouseX = 0.0;
            let mouseY = 0.0;


            canvas.addEventListener(
                "mousemove",
                e =>
                {
                    const rect = canvas.getBoundingClientRect();
            
                    const dpr = window.devicePixelRatio || 1;
            
                    mouseX = (e.clientX - rect.left) * dpr;
            
                    mouseY = (rect.height - (e.clientY - rect.top)) * dpr;
                }
            );



            function resize()
            {
                const dpr = window.devicePixelRatio || 1;

                const width = Math.floor(canvas.clientWidth * dpr);
                const height = Math.floor(canvas.clientHeight * dpr);

                if (canvas.width !== width ||
                    canvas.height !== height)
                {
                    canvas.width = width;
                    canvas.height = height;
                }
            }



            function frame(t)
            {
                resize();


                gl.viewport(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                if (uResolution)
                {
                    gl.uniform2f(
                        uResolution,
                        canvas.width,
                        canvas.height
                    );
                }


                if (uTime)
                {
                    gl.uniform1f(
                        uTime,
                        t * 0.001
                    );
                }


                if (uMouse)
                {
                    gl.uniform2f(
                        uMouse,
                        mouseX,
                        mouseY
                    );
                }


                gl.drawArrays(
                    gl.TRIANGLES,
                    0,
                    3
                );


                requestAnimationFrame(frame);
            }


            requestAnimationFrame(frame);

        });

})();
</script>

{{ end }}
