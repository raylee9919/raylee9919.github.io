# SSG site configuration

title: "SeongWoo Lee"
base_url: "https://seongwoolee.com/"
description: "SeongWoo Lee's Website"
default_author: "SeongWoo Lee"

# Where to read content/static from. Relative paths are resolved relative to
# this file's directory. Content and static assets live in this repo now -
# self-contained, no reach-outside-the-repo path to a separate Blog/ checkout.
content_dir: "content"
static_dirs:
  - "static"
output_dir: "public"

# Section directories under content_dir that hold post/project bundles.
sections:
  projects:
    label_en: "Projects"
    label_ko: "프로젝트"
  posts:
    label_en: "Posts"
    label_ko: "포스트"
  studies:
    label_en: "Short Form"
    label_ko: "숏폼"

# First language listed is the default (served at site root).
# Others are served under /<lang>/.
languages:
  en:
    label: "English"
    date_format: "%B %-d, %Y"
  ko:
    label: "한국어"
    date_format: "%Y-%m-%d"

author:
  name: "SeongWoo Lee"
  name_ko: "이성우"
  title: "Programmer, Game Dev, Graphics Apprentice"
  title_ko: "프로그래머, 게임 개발자, 그래픽스 학도"
  avatar: "/images/profile.jpg"

# Leave visitor_log_url unset/empty to disable the visitor beacon (e.g. local/
# dev builds). See worker/README.md to deploy your own free Cloudflare Worker
# and fill this in with its URL.
analytics:
  visitor_log_url: "https://ssg-visitor-log.seongwoolee.workers.dev"

social:
  - name: "GitHub"
    url: "https://github.com/raylee9919"
    icon: "github"
  - name: "YouTube"
    url: "https://www.youtube.com/@seongwoolee9919"
    icon: "youtube"
  - name: "X"
    url: "https://x.com/raylee9919"
    icon: "x"
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/swl99/"
    icon: "linkedin"
